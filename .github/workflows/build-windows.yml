# Build do FileMorph para Windows.
#
# Em todo push e pull request: testes (unitários e de integração), o
# executável com o PyInstaller, a verificação dele (--smoke-test), o
# instalador com o Inno Setup e o executável portátil, com os SHA-256.
# Tudo fica disponível nos artefatos da execução.
#
# Numa tag vX.Y.Z (a mesma versão de app/version.py), os mesmos arquivos
# são anexados a uma GitHub Release criada como rascunho — a publicação
# continua sendo uma decisão manual. Nenhuma credencial fica no arquivo:
# a release usa o GITHUB_TOKEN que o próprio GitHub fornece à execução.

name: build-windows

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Código
        uses: actions/checkout@v4

      - name: Python 3.13 (64 bits)
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            constraints-release.txt

      - name: Dependências (versões testadas)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt -r requirements-dev.txt -c constraints-release.txt

      - name: Versão da tag confere com app/version.py
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $versao = (Select-String -Path app/version.py -Pattern '^__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $tag = "${{ github.ref_name }}".TrimStart('v')
          if ($versao -ne $tag) { throw "A tag v$tag não bate com __version__ = $versao em app/version.py." }

      - name: Testes unitários
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -m "not integration" -q

      - name: Testes de integração
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -m integration -q

      - name: Inno Setup
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress -y
          }

      - name: Executável, verificação, instalador, portátil e SHA-256
        env:
          # O runner não garante uma área de trabalho para a janela da
          # verificação; a plataforma offscreen do Qt cria a janela sem tela.
          QT_QPA_PLATFORM: offscreen
        run: |
          $python = (Get-Command python).Source
          powershell -NoProfile -ExecutionPolicy Bypass -File .\empacotar.ps1 -Portatil -PularTestes -Python $python
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Artefatos
        uses: actions/upload-artifact@v4
        with:
          name: FileMorph-windows-${{ github.sha }}
          if-no-files-found: error
          path: |
            dist/installer/FileMorph-*-setup.exe
            dist/installer/FileMorph-*-setup.exe.sha256
            dist/portable/FileMorph-*-portable.exe
            dist/portable/FileMorph-*-portable.exe.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar os artefatos
        uses: actions/download-artifact@v4
        with:
          name: FileMorph-windows-${{ github.sha }}
          path: release

      - name: Release (rascunho)
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: FileMorph ${{ github.ref_name }}
          files: release/**/*
          fail_on_unmatched_files: true
