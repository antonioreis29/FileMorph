[pytest]
# Configuração da suíte de testes do FileMorph.
#
#   python -m pytest                          toda a suíte
#   python -m pytest -m "not integration"     só os testes unitários
#   python -m pytest -m integration           só os de integração
#
# Nenhum teste executa o FFmpeg ou o LibreOffice de verdade: a detecção dos
# dois é substituída por "ausente" em `tests/conftest.py`, e os testes que
# precisam de um deles usam os programas de mentira `tests/fake_ffmpeg.py` e
# `tests/fake_soffice.py`. Assim o resultado não muda conforme o que está
# instalado na máquina que roda a suíte.
testpaths = tests
markers =
    integration: roda processos externos (os programas de mentira do FFmpeg e do LibreOffice, uma segunda instância do aplicativo) ou a janela principal inteira; mais lento que um teste unitário
    windows: depende de comportamento do Windows (nomes sem distinção de maiúsculas, pastas conhecidas, travas de arquivo); é pulado nos outros sistemas
addopts = -p no:cacheprovider
